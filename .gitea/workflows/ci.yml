name: CI

# GitHub Actions is retired for the Rust and Apple jobs; they run on the
# self-hosted Gitea runners instead. Gitea mirrors this repo on every push via
# webhook, so a run starts within seconds of the GitHub push.
#
# Runners:
#   ubuntu-latest  Docker mode (jiun-mini) — catthehacker/ubuntu:act-latest.
#   macos-arm64    Host mode (jiun-mini-macos) — the mac mini itself, so
#                  Xcode/xcodegen/rustup are the machine's own installs and
#                  must not be reconfigured by a job.
#
# The Windows job stays on GitHub Actions (.github/workflows/ci-windows.yml):
# there is no self-hosted Windows runner.
#
# Mirrors are read-only, so `workflow_dispatch` is the only way to re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust workspace (lives in core/, no root Cargo.toml).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # The CLI links keyring (Secret Service → libdbus) and arboard (clipboard → xcb).
      - name: Install Linux system deps
        run: |
          set -euo pipefail
          # The runner host corrupts bytes in transit intermittently — it has shown
          # up as `bad record mac` on curl, `tls: bad record MAC` in buildkit, and
          # as apt `Hash Sum mismatch` on files whose size matched exactly.
          # Re-fetching the same file afterwards succeeds, so it is transient.
          # Nothing in a workflow fixes the host; retry around it, and drop both
          # apt caches in between or the retry just re-reads the corrupt copy.
          apt_try() {
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              echo "apt attempt $attempt failed; clearing caches, retrying in $((attempt * 10))s" >&2
              rm -rf /var/lib/apt/lists/*
              apt-get clean
              sleep $((attempt * 10))
            done
            echo "apt gave up after 4 attempts: $*" >&2
            return 1
          }
          apt_try apt-get update
          apt_try apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check RustSec advisories
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --locked --config ../.gitea/deny.toml check advisories

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Build CLI (release)
        run: cargo build --locked -p otpeek-cli --release

  # ---------------------------------------------------------------------------
  # Apple app. Builds the Rust xcframework + Swift bindings, generates the
  # Xcode project with XcodeGen, then builds both app schemes unsigned.
  #
  # This job runs in *host* mode on the mac mini, so unlike the GitHub version
  # it deliberately does not install a toolchain or seed a cargo cache: the
  # machine's own rustup and ~/.cargo are already warm, and rewriting them from
  # CI would leak into the operator's environment. Only `rustup target add`
  # runs, which is additive and idempotent.
  # ---------------------------------------------------------------------------
  apple:
    name: Apple (macOS and iOS)
    runs-on: macos-arm64
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          uname -smr
          xcodebuild -version
          rustup show
          xcodegen --version

      - name: Add Apple Rust targets
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust core (xcframework + Swift bindings)
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          apple/scripts/build-core.sh --require-all-targets

      - name: Generate Xcode project
        working-directory: apple
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          xcodegen generate

      - name: Build macOS app (unsigned)
        run: |
          xcodebuild -project apple/Otpeek.xcodeproj -scheme Otpeek-macOS \
            -destination 'generic/platform=macOS' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build iOS device app (unsigned)
        run: |
          xcodebuild -project apple/Otpeek.xcodeproj -scheme Otpeek-iOS \
            -destination 'generic/platform=iOS' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Simulator app (arm64, unsigned)
        run: |
          xcodebuild -project apple/Otpeek.xcodeproj -scheme Otpeek-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS-Sim" \
            build CODE_SIGNING_ALLOWED=NO
