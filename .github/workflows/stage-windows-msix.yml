name: Stage Windows 2.1.0 unsigned package

on:
  push:
    branches: [release/windows-v2.1.0-staging]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Restore app and widget dependencies
        shell: pwsh
        run: |
          dotnet restore windows/Otpeek.App/Otpeek.App.csproj -p:Platform=x64 -p:WindowsPackageType=MSIX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore windows/Otpeek.Widget/Otpeek.Widget.csproj -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'windows/Otpeek.Widget/obj/project.assets.json')) { throw 'Missing widget restore output' }
      - name: Build x64 MSIX bundle
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'windows-sdk-contracts.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'windows-sdk-contracts'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.contracts/10.0.22621.3233/microsoft.windows.sdk.contracts.10.0.22621.3233.nupkg' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $sdk
          $metadata = Join-Path $sdk 'ref\netstandard2.0'
          if (!(Test-Path (Join-Path $metadata 'Windows.Foundation.UniversalApiContract.winmd'))) { throw 'Missing Windows SDK metadata' }
          dotnet build windows/Otpeek.App/Otpeek.App.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxBundlePlatforms=x64 -p:AppxBundle=Always -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageSigningEnabled=false "-p:CsWinRTWindowsMetadata=$metadata" --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bundle for release signing
        uses: actions/upload-artifact@v4
        with:
          name: OTPeek-Windows-x64-v2.1.0-unsigned
          path: windows/Otpeek.App/AppPackages/**/*.msixbundle
          if-no-files-found: error
          retention-days: 14
