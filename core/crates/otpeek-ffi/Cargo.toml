[package]
name = "otpeek-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "otpeek_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
otpeek-core = { path = "../otpeek-core" }
otpeek-vault = { path = "../otpeek-vault" }
# Swift and C# supply their own sync backends over UniFFI.
otpeek-sync = { path = "../otpeek-sync", default-features = false }
uniffi = { workspace = true, features = ["cli"] }
thiserror.workspace = true
uuid.workspace = true
